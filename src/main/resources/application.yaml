app:
  domain: ${DOMAIN}

spring:
  profiles:
    default: dev
  application:
    name: divum-backend
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.create-database-schemas: true
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
        default_schema: divum

cloudflare:
  api-url: "https://api.cloudflare.com/client/v4/zones/%s/dns_records"
  zone-id: ${CLOUDFLARE_DOMAIN_ZONE_ID}
  domain-api-token: ${CLOUDFLARE_DOMAIN_API_TOKEN}

divum-daemon:
  api-scheme: https://
  api-version: /api/v1