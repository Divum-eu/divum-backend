app:
  domain: ${DOMAIN}

spring:
  application:
    name: divum-backend
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
        connection:
          url: jdbc:postgresql://localhost:5432/postgres
          username: postgres

cloudflare:
  zone-id: ${CLOUDFLARE_DOMAIN_ZONE_ID}
  domain-api-token: ${CLOUDFLARE_DOMAIN_API_TOKEN}