app:
  domain: ${DOMAIN}

cors:
  allowed-origins: "https://divum.eu"

spring:
  profiles:
    default: dev
  application:
    name: divum-backend
  config:
    import: optional:file:.env[.properties]
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    default-schema: divum

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.create-database-schemas: true
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
        default_schema: divum


cloudflare:
  api-url: "https://api.cloudflare.com/client/v4/zones/%s/dns_records"
  zone-id: ${CLOUDFLARE_DOMAIN_ZONE_ID}
  domain-api-token: ${CLOUDFLARE_DOMAIN_API_TOKEN}

divum-daemon:
  api-scheme: https://
  api-version: /api/v1
  jwt-token-lifetime-seconds: 30

server:
  servlet:
    context-path: /api

security:
  jwt:
    daemon-issuer: divum-backend
    key-rotation-period-hours: 24