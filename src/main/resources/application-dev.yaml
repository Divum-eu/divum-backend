cors:
  allowed-origins: "https://divum.eu,http://localhost:4200" # Comma separated value, DON'T add whitespace

divum-daemon:
  api-scheme: http://
  api-version: :8000/api/v1
  ws-scheme: ws://
  jwt-token-lifetime-seconds: 60

security:
  jwt:
    daemon-issuer: divum-backend-dev
    key-rotation-period-hours: 24
