info:
  name: Refresh user access token
  type: http
  seq: 18

http:
  method: POST
  url: "{{address}}/{{base_route}}/auth/refresh"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.body;
        bru.setEnvVar("accessToken", data.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
