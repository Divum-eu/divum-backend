info:
  name: CreateMinecraftServer
  type: http
  seq: 1

http:
  method: POST
  url: "{{address}}/{{base_route}}/minecraft-servers"
  body:
    type: json
    data: |-
      {
        "username": "dimitar",
        "configuration": {
          // As per the official Minecraft server documentation (default values listed here)
          "memoryLimit": 2000,
          "cpuCoresLimit": 2,
          "eula": true,
          "version": "latest",
          "type": "VANILLA",
          "motd": "Brought to you by Divum. Enjoy!",
          "difficulty": "easy",
          "mode": "survival",
          "level": "world",
          "onlineMode": true,
          "resourcePack": "",
          "resourcePackSha1": "",
          "resourcePackEnforce": false,
          "enableWhitelist": false,
          "whitelist": [],
          "overrideWhitelist": false,
          "enableRcon": true,
          "rconPassword": "your_secure_password",
          "broadcastRconToOps": false,
          "ops": [],
          "opPermissionLevel": 0,
          "seed": "",
          "pvp": true,
          "serverName": "MyAwesomeServer",
          "serverAddress": "127.0.0.2"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
